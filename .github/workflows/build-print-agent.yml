name: Build Machine-Control Print Apps
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PrintAgent/**'
      - 'PrintSettings/**'
      - '.github/workflows/build-print-agent.yml'
  push:
    branches: [main]
    paths:
      - 'PrintAgent/**'
      - 'PrintSettings/**'
      - '.github/workflows/build-print-agent.yml'
concurrency:
  group: machine-control-print-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Tạo hai EXE Windows 10
    runs-on: windows-2022
    env:
      RELEASE_VERSION: 1.0.70
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build ứng dụng nhận lệnh in
        shell: pwsh
        run: |
          & ./PrintAgent/generate-icon.ps1
          if (-not (Test-Path PrintAgent/printer.ico)) { throw "Không tạo được icon máy in" }
          dotnet publish PrintAgent/PrintAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.RELEASE_VERSION }} -o publish
          Copy-Item publish/Machine-Control-Print-Agent.exe publish/Print-Agent.exe
          Remove-Item publish/Machine-Control-Print-Agent.exe
      - name: Build ứng dụng cài đặt
        shell: pwsh
        run: |
          dotnet publish PrintSettings/PrintSettings.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.RELEASE_VERSION }} -o publish
          if (-not (Test-Path publish/Print-Agent.exe)) { throw "Thiếu Print-Agent.exe" }
          if (-not (Test-Path publish/Print-Settings.exe)) { throw "Thiếu Print-Settings.exe" }
      - name: Tải SumatraPDF Portable chính thức và kiểm tra SHA-256
        shell: pwsh
        run: |
          $url = 'https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip'
          $expected = '98b33a518d42986856d225064b0cd2d3643ecf78cbf84ab873d26cc51877a544'
          Invoke-WebRequest -Uri $url -OutFile sumatra-portable.zip -MaximumRedirection 5
          $actual = (Get-FileHash sumatra-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 SumatraPDF không khớp" }
          Expand-Archive sumatra-portable.zip -DestinationPath sumatra-portable -Force
          $exe = Get-ChildItem sumatra-portable -Filter 'SumatraPDF-*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Gói SumatraPDF không có Portable EXE" }
          Copy-Item $exe.FullName publish/SumatraPDF.exe
          @'
          SumatraPDF Portable 3.6.1 (c) tác giả dự án SumatraPDF.
          Trang chính thức: https://www.sumatrapdfreader.org/
          Mã nguồn và giấy phép: https://github.com/sumatrapdfreader/sumatrapdf
          Gói nguyên bản: https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip
          Phần mềm bên thứ ba có giấy phép riêng. Không áp dụng giấy phép Print Agent cho SumatraPDF.
          '@ | Set-Content -Encoding utf8 publish/SUMATRA-NOTICE.txt
      - name: Đóng gói hướng dẫn và lệnh thử
        shell: pwsh
        run: |
          Copy-Item PrintAgent/sample-job.json publish/sample-job.json
          Copy-Item README.md publish/README.md
      - name: Đóng gói cập nhật tự động có SHA-256
        shell: pwsh
        run: |
          $files = @('Print-Agent.exe','Print-Settings.exe')
          foreach ($item in $files) { if (-not (Test-Path (Join-Path publish $item))) { throw "Thiếu $item" } }
          Compress-Archive -Path (Join-Path publish 'Print-Agent.exe'),(Join-Path publish 'Print-Settings.exe') -DestinationPath Machine-Control-Print-Update.zip -CompressionLevel Optimal
          $asset = Get-Item Machine-Control-Print-Update.zip
          $digest = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            version = '${{ env.RELEASE_VERSION }}'
            sha256 = $digest
            size = $asset.Length
            sumatraSha256 = (Get-FileHash publish/SumatraPDF.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            sumatraSize = (Get-Item publish/SumatraPDF.exe).Length
          } | ConvertTo-Json | Set-Content -Encoding utf8 update-manifest.json
      - name: Phát hành phiên bản mới trên GitHub Releases (repo private)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'print-v${{ env.RELEASE_VERSION }}'
          gh release create $tag Machine-Control-Print-Update.zip update-manifest.json publish/SumatraPDF.exe publish/SUMATRA-NOTICE.txt --title "Print Agent v${{ env.RELEASE_VERSION }}" --notes "Cập nhật tự động cho Print Agent và Print Settings, giữ nguyên config.ini và agent-id.txt." --latest --target "${{ github.sha }}"
      - name: Xuất hai ứng dụng Windows
        uses: actions/upload-artifact@v4
        with:
          name: Machine-Control-Two-Print-Apps-Win10-x64
          path: publish/
          retention-days: 30
